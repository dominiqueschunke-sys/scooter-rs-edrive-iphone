
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151f">
  <title>SCOOTER RS e-DRIVE</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #10151f;
      --panel: #1a2230;
      --border: #344155;
      --text: #f4f7fb;
      --muted: #a9b5c8;
      --accent: #59e0b0;
      --danger: #ff7373;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 14px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    main {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      font-size: 25px;
      margin-bottom: 6px;
    }

    h2 {
      font-size: 18px;
      margin-top: 0;
    }

    p {
      color: var(--muted);
      line-height: 1.5;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin: 16px 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 600;
      margin: 12px 0;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #7b8798;
      flex-shrink: 0;
    }

    .dot.online { background: var(--accent); }
    .dot.error { background: var(--danger); }

    button {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #283548;
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #071b16;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .value {
      font-size: 17px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    #log {
      min-height: 100px;
      max-height: 350px;
      overflow-y: auto;
      padding: 12px;
      border-radius: 10px;
      background: #0a0e15;
      color: #c6f7e4;
      font: 12px/1.6 ui-monospace, SFMono-Regular, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .small {
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>

<body>
<main>
  <h1>SCOOTER RS e-DRIVE</h1>
  <p>Bluetooth- und GPS-Diagnose</p>

  <section class="panel">
    <h2>Bluetooth</h2>

    <div class="status">
      <span id="btDot" class="dot"></span>
      <span id="btStatus">Nicht verbunden</span>
    </div>

    <p>Gerät: <span id="deviceName" class="value">Kein Gerät</span></p>

    <button class="primary" id="connectBtn">
      Scooter verbinden
    </button>

    <button id="inspectBtn" disabled>
      GATT-Dienste anzeigen
    </button>

    <button id="readBtn" disabled>
      Bluetooth-Daten auslesen (0004 / 0005)
    </button>

    <button id="disconnectBtn" disabled>
      Verbindung trennen
    </button>

    <p class="small">
      Es werden keine Schreibbefehle an den Scooter gesendet.
    </p>
  </section>

  <section class="panel">
    <h2>GPS-Diagnose</h2>
    <p>Position: <span id="gpsPosition" class="value">Noch nicht abgefragt</span></p>
    <p>Genauigkeit: <span id="gpsAccuracy">-</span></p>
    <button id="gpsBtn">GPS-Position abfragen</button>
  </section>

  <section class="panel">
    <h2>Diagnoseprotokoll</h2>
    <div id="log" role="log" aria-live="polite">System bereit.</div>
    <button id="copyBtn">Protokoll kopieren</button>
    <button id="clearBtn">Protokoll leeren</button>
  </section>
</main>

<script>
"use strict";

const FE95 = "0000fe95-0000-1000-8000-00805f9b34fb";

let scooterDevice = null;
let scooterServer = null;
let scooterService = null;

const $ = id => document.getElementById(id);

function log(message) {
  const time = new Date().toLocaleTimeString("de-DE");
  const line = "[" + time + "] " + message;
  const area = $("log");

  area.textContent += "\n" + line;
  area.scrollTop = area.scrollHeight;
}

function setBluetoothStatus(message, state = "") {
  $("btStatus").textContent = message;
  $("btDot").className = "dot" + (state ? " " + state : "");
}

function updateButtons() {
  const connected = !!scooterServer?.connected;

  $("connectBtn").disabled = connected;
  $("inspectBtn").disabled = !connected;
  $("readBtn").disabled = !connected;
  $("disconnectBtn").disabled = !connected;
}

function getErrorMessage(error) {
  if (!error) return "Unbekannter Fehler";
  return error.message || String(error);
}

async function connectScooter() {
  if (!navigator.bluetooth) {
    log("Web Bluetooth ist nicht verfügbar.");
    log("Bitte Bluefy verwenden und die Seite über HTTPS öffnen.");
    alert("Web Bluetooth ist in diesem Browser nicht verfügbar.");
    return;
  }

  try {
    log("Bluetooth-Geräteauswahl wird geöffnet.");

    scooterDevice = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [FE95]
    });

    $("deviceName").textContent =
      scooterDevice.name || "Unbenanntes Gerät";

    log("Ausgewähltes Gerät: " +
      (scooterDevice.name || "Unbenanntes Gerät"));

    scooterDevice.addEventListener(
      "gattserverdisconnected",
      onDisconnected
    );

    log("Verbinde über Bluetooth GATT ...");

    scooterServer = await scooterDevice.gatt.connect();

    setBluetoothStatus("Verbunden", "online");
    log("GATT-Verbindung hergestellt.");

    updateButtons();
    await inspectServices();

  } catch (error) {
    log("Bluetooth-Fehler: " + getErrorMessage(error));
    setBluetoothStatus("Verbindung fehlgeschlagen", "error");
    updateButtons();
  }
}

async function inspectServices() {
  if (!scooterServer?.connected) {
    log("Keine aktive Bluetooth-Verbindung.");
    return;
  }

  try {
    log("Suche verfügbare GATT-Dienste ...");

    const services = await scooterServer.getPrimaryServices();

    log("Gefundene Dienste: " + services.length);

    scooterService = null;

    for (const service of services) {
      log("Dienst: " + service.uuid);

      if (service.uuid.toLowerCase() === FE95) {
        scooterService = service;
      }

      try {
        const characteristics =
          await service.getCharacteristics();

        for (const characteristic of characteristics) {
          const p = characteristic.properties;
          const flags = [];

          if (p.read) flags.push("read");
          if (p.write) flags.push("write");
          if (p.writeWithoutResponse) {
            flags.push("write-no-response");
          }
          if (p.notify) flags.push("notify");
          if (p.indicate) flags.push("indicate");

          const shortId = characteristic.uuid
            .split("-")[0]
            .replace(/^0000/, "");

          log("  Merkmal: " + shortId +
            " [" + flags.join(", ") + "]");
        }
      } catch (error) {
        log("Merkmale konnten nicht aufgelistet werden: " +
          getErrorMessage(error));
      }
    }

    if (!scooterService) {
      log("Dienst FE95 wurde nicht gefunden.");
    } else {
      log("Dienst FE95 ist verfügbar.");
    }

  } catch (error) {
    log("Fehler bei der Dienstsuche: " +
      getErrorMessage(error));
  }
}

async function readScooterCharacteristics() {
  if (!scooterServer?.connected) {
    alert("Bitte zuerst den Scooter per Bluetooth verbinden.");
    log("Lesetest abgebrochen: keine Verbindung.");
    return;
  }

  try {
    const service = scooterService ||
      await scooterServer.getPrimaryService(FE95);

    for (const shortId of ["0004", "0005"]) {
      const uuid =
        "0000" + shortId + "-0000-1000-8000-00805f9b34fb";

      try {
        const characteristic =
          await service.getCharacteristic(uuid);

        if (!characteristic.properties.read) {
          log(shortId + ": Lesen nicht erlaubt.");
          continue;
        }

        const value = await characteristic.readValue();
        const bytes = [];

        for (let i = 0; i < value.byteLength; i++) {
          bytes.push(
            value.getUint8(i).toString(16).padStart(2, "0")
          );
        }

        log(
          shortId + " gelesen (" + value.byteLength +
          " Byte): " +
          (bytes.length ? bytes.join(" ") : "(leer)")
        );

      } catch (error) {
        log(shortId + ": Lesefehler: " +
          getErrorMessage(error));
      }
    }
  } catch (error) {
    log("Bluetooth-Lesefehler: " + getErrorMessage(error));
  }
}

function onDisconnected() {
  setBluetoothStatus("Nicht verbunden");
  scooterServer = null;
  scooterService = null;
  log("Bluetooth-Verbindung getrennt.");
  updateButtons();
}

function disconnectScooter() {
  log("Trennung angefordert.");

  if (scooterDevice?.gatt?.connected) {
    scooterDevice.gatt.disconnect();
  } else {
    onDisconnected();
  }
}

function requestGPS() {
  if (!navigator.geolocation) {
    log("GPS/Geolocation wird nicht unterstützt.");
    return;
  }

  log("GPS-Positionsabfrage gestartet.");

  navigator.geolocation.getCurrentPosition(
    position => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      $("gpsPosition").textContent =
        lat.toFixed(6) + ", " + lon.toFixed(6);

      $("gpsAccuracy").textContent =
        Math.round(accuracy) + " m";

      log("GPS-Position empfangen.");
      log("Koordinaten: " + lat + ", " + lon);
      log("Genauigkeit: " + Math.round(accuracy) + " m");
    },
    error => {
      log("GPS-Fehler: " + error.message);
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
}

async function copyLog() {
  const text = $("log").textContent;

  try {
    await navigator.clipboard.writeText(text);
    log("Protokoll in die Zwischenablage kopiert.");
  } catch (error) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();

    const success = document.execCommand("copy");
    area.remove();

    log(success
      ? "Protokoll kopiert."
      : "Kopieren fehlgeschlagen. Bitte manuell markieren.");
  }
}

$("connectBtn").addEventListener("click", connectScooter);
$("inspectBtn").addEventListener("click", inspectServices);
$("readBtn").addEventListener("click", readScooterCharacteristics);
$("disconnectBtn").addEventListener("click", disconnectScooter);
$("gpsBtn").addEventListener("click", requestGPS);
$("copyBtn").addEventListener("click", copyLog);

$("clearBtn").addEventListener("click", () => {
  $("log").textContent = "Protokoll geleert.";
});

log("SCOOTER RS e-DRIVE gestartet.");
log("Bereit für Bluetooth- und GPS-Diagnose.");

if (!window.isSecureContext) {
  log("Hinweis: HTTPS wird für Bluetooth benötigt.");
}
</script>
</body>
</html>
