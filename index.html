<script>
function go(id,btn){
 document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===id));
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===id));
 window.scrollTo({top:0,behavior:'smooth'});
 if(id==='diagnose')runChecks();
 if(id==='rides')renderLogs();
}
function toggleDemo(){
 if(demoOn){demoOn=false;clearInterval(demoTimer);$('demoBtn').textContent='▶ Demo starten';$('rideStatus').textContent='Demo pausiert';return}
 demoOn=true;demoStart=Date.now()-demoElapsed*1000;
 $('demoBtn').textContent='Ⅱ Demo pausieren';$('rideStatus').textContent='Demo läuft · simulierte Werte';
 demoTimer=setInterval(()=>{
  demoSeconds=Math.floor((Date.now()-demoStart)/1000);demoElapsed=demoSeconds;
  const s=Math.min(32,Math.abs(Math.sin(demoSeconds/8)*25+Math.sin(demoSeconds/3)*4));
  $('speed').textContent=Math.round(s);$('time').textContent=fmt(demoSeconds);
  $('dist').innerHTML=(demoSeconds*s/3600).toFixed(2)+' <small>km</small>';
 },500);
}
function resetDemo(){
 demoOn=false;clearInterval(demoTimer);demoElapsed=0;demoSeconds=0;
 $('speed').textContent='0';$('time').textContent='00:00';$('dist').innerHTML='0.00 <small>km</small>';
 $('demoBtn').textContent='▶ Demo starten';$('rideStatus').textContent='Bereit zur Demo-Fahrt';
}
function fmt(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}
function readLogs(){try{return JSON.parse(localStorage.getItem('scooterRS.logs')||'[]')}catch(e){return []}}
function writeLogs(a){try{localStorage.setItem('scooterRS.logs',JSON.stringify(a))}catch(e){alert('Speichern nicht möglich. Prüfe den Browser-Speicher.')}}
function startGps(){
 if(!navigator.geolocation){alert('GPS ist in diesem Browser nicht verfügbar. Öffne die App über HTTPS in Safari.');return}
 if(!window.isSecureContext){alert('GPS benötigt eine sichere HTTPS-Adresse.');return}
 if(gpsWatch!==null)return;
 gpsMeters=0;gpsSeconds=0;gpsStart=Date.now();gpsLast=null;$('gpsBadge').textContent='LÄUFT';
 gpsTimer=setInterval(()=>{$('gpsTime').textContent=fmt(++gpsSeconds)},1000);
 gpsWatch=navigator.geolocation.watchPosition(pos=>{
  const p={lat:pos.coords.latitude,lon:pos.coords.longitude};
  if(gpsLast){const d=hav(gpsLast,p);if(d<100)gpsMeters+=d}
  $('gpsDist').innerHTML=(gpsMeters/1000).toFixed(2)+' <small>km</small>';
  gpsLast=p;$('gpsPermission').textContent='ERLAUBT';
 },err=>{alert('GPS-Fehler: '+err.message);stopGps()}, {enableHighAccuracy:true,maximumAge:2000,timeout:15000});
}
function stopGps(){
 if(gpsWatch!==null)navigator.geolocation.clearWatch(gpsWatch);
 gpsWatch=null;clearInterval(gpsTimer);$('gpsBadge').textContent='BEREIT';
 if(gpsStart&&gpsSeconds>0){
  const logs=readLogs();
  logs.unshift({date:new Date(gpsStart).toLocaleString('de-DE'),seconds:gpsSeconds,km:Number((gpsMeters/1000).toFixed(3))});
  writeLogs(logs);renderLogs();
 }
 gpsStart=null;
}
function hav(a,b){
 const r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r;
 const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
 return 6371000*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function renderLogs(){
 const logs=readLogs();
 $('logs').innerHTML=logs.length?logs.map(x=>'<div class="log"><div class="row"><strong>'+esc(x.date)+'</strong><strong>'+Number(x.km).toFixed(2)+' km</strong></div><div class="small muted" style="margin-top:5px">Fahrtdauer: '+fmt(Number(x.seconds)||0)+'</div></div>').join(''):'<div class="empty">Noch keine gespeicherten Fahrten.</div>';
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function exportCsv(){
 const logs=readLogs();if(!logs.length){alert('Noch keine Fahrten vorhanden.');return}
 const csv='Datum,Dauer Sekunden,Distanz km\n'+logs.map(x=>'"'+String(x.date).replace(/"/g,'""')+'",'+x.seconds+','+x.km).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='scooter-rs-fahrten.csv';a.click();URL.revokeObjectURL(a.href);
}
function clearLogs(){if(confirm('Alle gespeicherten Fahrten löschen?')){localStorage.removeItem('scooterRS.logs');renderLogs()}}
function saveProfile(notify=false){
 const p={mode:$('mode').value,response:$('response').value,brightness:$('brightness').value};
 try{localStorage.setItem('scooterRS.profile',JSON.stringify(p))}catch(e){}
 $('responseVal').textContent=p.response+'%';$('brightnessVal').textContent=p.brightness+'%';
 if(notify)alert('Profil lokal gespeichert. Es werden keine Roller-Einstellungen verändert.');
}
function loadProfile(){
 try{
  const p=JSON.parse(localStorage.getItem('scooterRS.profile')||'null');
  if(p){$('mode').value=p.mode||'comfort';$('response').value=p.response||50;$('brightness').value=p.brightness||80}
 }catch(e){}
 $('responseVal').textContent=$('response').value+'%';$('brightnessVal').textContent=$('brightness').value+'%';
}
function clearProfile(){
 if(confirm('Profil zurücksetzen?')){
  localStorage.removeItem('scooterRS.profile');$('mode').value='comfort';$('response').value=50;$('brightness').value=80;loadProfile();
 }
}
function checkGps(){
 if(!navigator.geolocation){alert('Geolocation wird nicht unterstützt.');return}
 if(!window.isSecureContext){alert('Die Seite ist nicht sicher (HTTPS). GPS benötigt HTTPS.');return}
 navigator.geolocation.getCurrentPosition(()=>{$('gpsPermission').textContent='ERLAUBT';alert('GPS-Berechtigung ist aktiv.')},e=>{alert('GPS nicht verfügbar: '+e.message)},{timeout:10000});
}
function runChecks(){
 const rows=[
  ['HTTPS-Verbindung',window.isSecureContext?'OK':'HTTPS nötig'],
  ['GPS im Browser',navigator.geolocation?'Unterstützt':'Nicht verfügbar'],
  ['Lokaler Speicher',(()=>{try{localStorage.setItem('_rs_test','1');localStorage.removeItem('_rs_test');return 'OK'}catch(e){return 'Nicht verfügbar'}})()],
  ['Web Bluetooth',navigator.bluetooth?'Unterstützt':'In diesem Browser nicht verfügbar'],
  ['Scooter-Verbindung',bleServer&&bleServer.connected?'Verbunden':'Nicht verbunden']
 ];
 $('checks').innerHTML=rows.map(r=>'<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><span>'+esc(r[0])+'</span><span class="small '+(r[1]==='OK'?'red':'muted')+'">'+esc(r[1])+'</span></div>').join('');
}
loadProfile();renderLogs();runChecks();
</script>
</body>
</html>
