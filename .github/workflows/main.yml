
name: Scooter RS iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Web-App vorbereiten
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: iOS-Projekt erzeugen
        run: npx cap add ios

      - name: iOS-App ohne Signierung bauen
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build-output \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build-Ergebnis speichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scooter-rs-build-debug
          path: build-output/Build/Products/Debug-iphoneos/
          if-no-files-found: warn
          retention-days: 3

        
      - name: Build-Ergebnis speichern
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: scooter-rs-ios-build
          path: ios/App/build/
          if-no-files-found: warn
          retention-days: 3
